services:
  postgres:
    image: postgres:16-alpine
    container_name: customer-account-db
    environment:
      POSTGRES_DB: customer_account_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  